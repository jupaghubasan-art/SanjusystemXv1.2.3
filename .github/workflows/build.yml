name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name:       - name: Unpack project zip if uploaded as a zip
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z"; done || true
          f=$(find . -maxdepth 3 -name settings.gradle.kts | head -1)
          if [ -n "$f" ] && [ "$f" != "./settings.gradle.kts" ]; then cp -r "$(dirname "$f")"/. . ; fi
          ls -la
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SanjuSystemX-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SanjuSystemX-release-apk
          path: app/build/outputs/apk/release/*.apk
